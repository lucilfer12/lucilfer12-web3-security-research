version: 2
engine: explicit-state-machine
policy: Compute eligibility from evidence; never mutate canonical status automatically.
promotions:
  - id: promotion.pattern.replay-state-reset
    kind: promotion-candidate
    status: blocked
    computed_stage: reproduced
    next_gate: corroborated
    missing: [cross_case]
    from: pattern.replay-state-reset
    to: validated-pattern
    reason: One canonical case exists; independent case corroboration is still required.
