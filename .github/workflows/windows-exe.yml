name: ATLAS Windows desktop

on:
  workflow_dispatch:
  push:
    branches:
      - "research-os/**"
      - "main"
      - "master"

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build portable executable
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/build_windows_exe.ps1

      - name: Smoke-test executable
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/test_windows_exe.ps1

      - name: Upload Windows desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-windows-x64
          path: |
            dist/ATLAS.exe
            dist/atlas-cli.exe
            dist/ATLAS.exe.sha256
            dist/atlas-cli.exe.sha256
            dist/BUILD-MANIFEST.txt
            dist/ATLAS-windows-x64.zip
          if-no-files-found: error
