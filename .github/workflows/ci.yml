name: research-ci
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate research records
        run: python -m unittest discover -s tests -v
      - name: Validate CLI
        run: PYTHONPATH=src python -m w3sec validate