name: ATLAS Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare federated source workspace
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\..\research-federation-work" | Out-Null
          git clone --depth 1 https://github.com/lucilfer12/web3-smart-contract-forensics.git "$env:GITHUB_WORKSPACE\..\web3-smart-contract-forensics"
          git clone --depth 1 https://github.com/lucilfer12/security-invariant-lab.git "$env:GITHUB_WORKSPACE\..\security-invariant-lab"
          git clone --depth 1 https://github.com/lucilfer12/web3-zeroday-forensics.git "$env:GITHUB_WORKSPACE\..\research-federation-work\web3-zeroday-forensics"
          git clone --depth 1 https://github.com/lucilfer12/smart-contract-security-lab.git "$env:GITHUB_WORKSPACE\..\research-federation-work\smart-contract-security-lab"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build ATLAS
        shell: pwsh
        run: .\scripts\build_windows_exe.ps1

      - name: Smoke-test ATLAS package
        shell: pwsh
        run: .\scripts\test_windows_exe.ps1

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            "dist/ATLAS-windows-x64.zip" `
            "dist/ATLAS.exe.sha256" `
            "dist/atlas-cli.exe.sha256" `
            --title "ATLAS $env:GITHUB_REF_NAME" `
            --generate-notes
