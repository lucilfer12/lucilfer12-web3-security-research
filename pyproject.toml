[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web3-security-research"
version = "0.0.0"
description = "A durable, evidence-first operating system for web3 security research"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.20",
  "Pillow>=11.0",
]

[project.scripts]
atlas = "w3sec.cli:main"
atlas-gui = "w3sec.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
