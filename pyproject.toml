[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web3-security-research"
version = "0.2.0"
description = "Reproducible research environment for adversarial analysis of decentralized systems"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.20",
]

[project.scripts]
w3sec = "w3sec.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
