[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "web3-security-research"
version = "0.1.0"
description = "Reproducible research environment for adversarial analysis of decentralized systems"
requires-python = ">=3.10"
[project.scripts]
w3sec = "w3sec.cli:main"
[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]